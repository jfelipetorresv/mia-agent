name: Mia CI

on:
  push:
  pull_request:

jobs:
  static-and-frontend:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: mia-ci-not-a-production-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q backend/mia execution scripts
      - name: Guard cumulative migration vocabularies
        shell: pwsh
        run: python execution/test_migration_contracts.py
      - name: Validate verification catalog
        shell: pwsh
        run: |
          $catalog = Get-Content -Raw config/verification.json | ConvertFrom-Json
          foreach ($path in $catalog.quick) { if (-not (Test-Path $path)) { throw "Prueba catalogada ausente: $path" } }
          foreach ($path in $catalog.critical_contracts) { if (-not (Test-Path $path)) { throw "Contrato crítico ausente: $path" } }
          if (-not $catalog.full_glob) { throw 'Falta full_glob en el catálogo' }
      - name: Install backend runtime for executable gates
        shell: pwsh
        run: python -m pip install './backend[full]'
      - name: Execute quick verification catalog
        shell: pwsh
        env:
          MIA_VERIFY_PYTHON: python
        run: ./scripts/verify.ps1 -Mode quick -ResultPath validation/ci-quick.json
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mia-ci-quick-verification
          path: validation/ci-quick.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit

  desktop-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Stub installer payloads for cargo check
        shell: pwsh
        run: |
          # packaging/dist está en .gitignore (artefactos del instalador).
          # tauri-build exige que las rutas de bundle.resources existan
          # incluso en `cargo check`; no empaquetamos el instalador aquí.
          foreach ($name in @('mia-backend', 'mia-litellm', 'mia-frontend', 'pgsql')) {
            New-Item -ItemType Directory -Force -Path "packaging/dist/$name" | Out-Null
          }
      - name: Check desktop shell
        working-directory: desktop/src-tauri
        run: cargo check --locked

  critical-legal-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mia_ci_super
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: backend
      PG_HOST: 127.0.0.1
      PG_PORT: "55432"
      PG_DB: mia
      PG_PASSWORD: mia_ci_super
      PG_APP_PASSWORD: mia_ci_app
      DATABASE_URL: postgresql://mia_app:mia_ci_app@127.0.0.1:55432/mia
      JWT_SECRET: mia-ci-not-a-production-secret-32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend runtime
        run: python -m pip install './backend[full]'
      - name: Bootstrap schema and migration ledger
        shell: bash
        run: |
          python execution/init_db.py
          python - <<'PY'
          import os
          from pathlib import Path
          from mia.setup.db_bootstrap import apply_migrations
          migrations = sorted(Path('backend/mia/db/migrations').glob('*.sql'))
          apply_migrations(os.environ['PG_HOST'], os.environ['PG_PORT'], os.environ['PG_DB'], os.environ['PG_PASSWORD'], migrations)
          PY
          python execution/init_checkpointer.py
      - name: Execute critical RLS and HITL contracts
        run: |
          python execution/test_rls.py
          python execution/test_hitl_flow.py
          python execution/test_matter_jurisdictions.py
          python execution/test_p0_legal_ledger.py
          python execution/test_durable_learning.py
          python execution/test_citation_seals.py
          python execution/test_document_derivation.py
          python execution/test_cors_contract.py
