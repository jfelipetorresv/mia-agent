# Mia - LiteLLM proxy (Modo B). Claves via variables de entorno (.env).
# Arranque: scripts/start_litellm.ps1 (puerto 4000).
model_list:
  - model_name: voyage-law-2
    litellm_params:
      model: voyage/voyage-law-2
      api_key: os.environ/VOYAGE_API_KEY
  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  # Modelo local para desarrollo (Ollama). Sin coste y sin Anthropic. Activar con
  # MIA_MODEL=mia-local en .env + reiniciar uvicorn. ollama_chat/ usa /api/chat.
  - model_name: mia-local
    litellm_params:
      model: ollama/qwen3-coder:30b
      api_base: http://127.0.0.1:11434

litellm_settings:
  drop_params: true
